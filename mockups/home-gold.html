<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZisplayTV – Accueil doré</title>
<style>
:root{--g1:#f6d365;--g2:#c9972b;--g3:#7a5410;--gd:#3a2a08}
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:Roboto,system-ui,sans-serif;color:#fff}
.screen{width:2000px;height:900px;position:relative;overflow:hidden;
 background:radial-gradient(ellipse at 85% 85%,#5a4010aa,transparent 55%),
 linear-gradient(180deg,#141836 0%,#0a0b1c 45%,#000 100%)}
.exp{position:absolute;top:44px;right:44px;font-size:38px;color:#d6d9ee}
.ver{position:absolute;bottom:34px;right:44px;font-size:38px}
.logo{position:absolute;top:120px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:0;font-size:58px;font-weight:300}
.logo .tri{width:105px;height:110px;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));clip-path:polygon(0 0,100% 50%,0 100%);margin-right:18px}
.logo span{position:relative;letter-spacing:1px}.logo b{font-weight:700;color:var(--g1)}
.grid{position:absolute;left:348px;top:279px;display:grid;grid-template-columns:455px 227px 227px 370px;gap:28px;grid-template-rows:185px 185px;column-gap:28px}
.t{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:32px;text-align:center;line-height:1.1;
 background:linear-gradient(160deg,#8a6414cc,#3a2a08 95%);box-shadow:inset 0 1px 0 #f6d36533}
.t svg{width:98px;height:98px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.canal{grid-row:1/3;grid-column:1;font-size:46px;gap:30px;background:linear-gradient(160deg,#a67c1ecc,#4a3408 90%);border:2px solid #f6d36566;box-shadow:0 0 40px #c9972b55, inset 0 1px 0 #f6d36555}
.canal svg{width:190px;height:190px;stroke-width:1.4}
.side{grid-column:4;grid-row:1/3;display:grid;grid-template-rows:repeat(3,1fr);gap:28px;margin-top:0}
.o{border:2px solid #c9972b99;border-radius:8px;background:#c9972b0d;display:flex;align-items:center;gap:32px;padding:0 46px;font-size:34px}
.o svg{width:54px;height:54px;fill:none;stroke:var(--g1);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{height:398px}
.gap{display:contents}
</style></head><body>
<div class="screen">
 <div class="exp">La liste de lecture actuelle expire: unlimited</div>
 <div class="logo"><div class="tri"></div><span>Zisplay<b>TV</b></span></div>
 <div class="grid">
  <div class="t canal"><svg viewBox="0 0 24 24" style="stroke-width:1.6"><path d="M8 3l4 3 4-3"/><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M10.5 10v6l5-3z"/></svg>Canal</div>
  <div class="t" style="grid-column:2;grid-row:1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8v8l6-4z"/></svg>Films</div>
  <div class="t" style="grid-column:3;grid-row:1"><svg viewBox="0 0 24 24"><path d="M3 9h18v11H3zM3 9l1-4 16-2 1 4M7 4.5l2 3M12 3.5l2 3"/></svg>Séries</div>
  <div class="t" style="grid-column:2;grid-row:2"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-5 3-7 7-7s7 2 7 7M16 5a3.5 3.5 0 010 7M18 15c3 1 4 3 4 6"/></svg>Compte</div>
  <div class="t" style="grid-column:3;grid-row:2"><svg viewBox="0 0 24 24"><circle cx="16" cy="6" r="3"/><circle cx="7" cy="15" r="3"/><path d="M11 19c3 0 5-2 5-5M5 4c3 0 5 1 5 4M8 6L5 4l3-2M13 17l3 2-3 2"/></svg><span style="font-size:27px">Changer de liste<br>de lecture</span></div>
  <div class="side">
   <div class="o"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Paramètres</div>
   <div class="o"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2M20 3v5h-5"/></svg>Recharger</div>
   <div class="o"><svg viewBox="0 0 24 24"><path d="M10 4H4v16h6M9 12h12M17 8l4 4-4 4"/></svg>SORTIR</div>
  </div>
 </div>
 <div class="ver">v4.0</div>
</div>
</body></html>
